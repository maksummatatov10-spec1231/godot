name: Godot native and visual validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      inspect_2d:
        description: Inspect the separately supplied 2D archive without redistributing it
        type: boolean
        default: false
      test_forest:
        description: Validate and screenshot the standalone Warden forest game
        type: boolean
        default: false
      publish_forest:
        description: Package and publish the validated forest project ZIP
        type: boolean
        default: false
      test_rust:
        description: Also build the optional Rust example
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.test_rust
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python and GDScript checks
        run: |
          pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v
          gdlint godot/scripts
          gdformat --check godot/scripts
      - name: Install graphics runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libvulkan1
      - name: Install and verify pinned Godot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(cat .godot-version)
          archive="Godot_v${tag}_linux.x86_64.zip"
          mkdir -p .tools/godot
          gh release download "$tag" --repo godotengine/godot --pattern "$archive" --pattern SHA512-SUMS.txt --dir .tools/godot
          cd .tools/godot
          grep -F " $archive" SHA512-SUMS.txt | sha512sum --check --strict -
          unzip "$archive"
          chmod +x "${archive%.zip}"
          echo "GODOT4_BIN=$PWD/${archive%.zip}" >> "$GITHUB_ENV"
      - name: GDScript-only smoke and rendering
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          python tools/check.py smoke
          "$GODOT4_BIN" --headless --path godot --script res://tests/plugin_smoke.gd
          python tools/check.py visual
      - name: C++ native bridge and visual state transition
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          python tools/build_cpp.py
          python tools/check.py smoke --require-cpp --test-input
          python tools/check.py visual --require-cpp
          python tools/check.py visual --require-cpp --test-input
          python tools/verify_lab_images.py
      - name: Rust toolchain, formatting, tests and native bridge
        if: github.event_name == 'workflow_dispatch' && inputs.test_rust
        run: |
          rustup show
          cargo fmt --manifest-path native/Cargo.toml --check
          cargo test --manifest-path native/Cargo.toml
          cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
          python tools/build_native.py
      - name: Rust-integrated smoke and rendering
        if: github.event_name == 'workflow_dispatch' && inputs.test_rust
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          python tools/check.py smoke --require-rust
          python tools/check.py visual --require-rust
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-validation
          path: artifacts/
          if-no-files-found: ignore
  capture:
    if: github.event_name == 'workflow_dispatch' && !inputs.test_rust && !inputs.test_forest && !inputs.publish_forest && !inputs.inspect_2d && github.ref_name == 'arena/449f84de-godot'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/449f84de-godot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install software Vulkan and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth mesa-vulkan-drivers libvulkan1 vulkan-tools gdb
          pip install -r requirements-dev.txt
      - name: Install verified Godot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(cat .godot-version)
          archive="Godot_v${tag}_linux.x86_64.zip"
          mkdir -p .tools/godot
          gh release download "$tag" --repo godotengine/godot --pattern "$archive" --pattern SHA512-SUMS.txt --dir .tools/godot
          cd .tools/godot
          grep -F " $archive" SHA512-SUMS.txt | sha512sum --check --strict -
          unzip "$archive"
          chmod +x "${archive%.zip}"
          echo "GODOT4_BIN=$PWD/${archive%.zip}" >> "$GITHUB_ENV"
      - name: Capture actual Forward+ frames
        id: capture
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Never let the loader silently choose another ICD or OpenGL.
          icd=$(find /usr/share/vulkan/icd.d -name '*lvp*json' -print -quit)
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export LIBGL_ALWAYS_SOFTWARE=1
          export LP_NUM_THREADS=1
          export LP_NATIVE_VECTOR_WIDTH=128
          python tools/capture_rendering.py --output docs/evidence/forward-plus --timeout 240
      - name: Publish screenshots and logs to the same working branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d docs/evidence/forward-plus ]; then
            echo 'No capture evidence was produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/evidence/forward-plus
          if ! git diff --cached --quiet; then
            git commit -m 'Record real Forward+ capture evidence [skip ci]'
            git push origin HEAD:arena/449f84de-godot
          fi
      - name: Fail honestly when rendering or validation failed
        if: steps.capture.outcome != 'success'
        run: exit 1

  forest:
    if: github.event_name == 'workflow_dispatch' && inputs.test_forest && github.ref_name == 'arena/449f84de-godot'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/449f84de-godot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install software Vulkan and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth mesa-vulkan-drivers libvulkan1 vulkan-tools gdb
          pip install -r requirements-dev.txt
      - name: Install verified Godot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(cat .godot-version)
          archive="Godot_v${tag}_linux.x86_64.zip"
          mkdir -p .tools/godot
          gh release download "$tag" --repo godotengine/godot --pattern "$archive" --pattern SHA512-SUMS.txt --dir .tools/godot
          cd .tools/godot
          grep -F " $archive" SHA512-SUMS.txt | sha512sum --check --strict -
          unzip "$archive"
          chmod +x "${archive%.zip}"
          echo "GODOT4_BIN=$PWD/${archive%.zip}" >> "$GITHUB_ENV"
      - name: Test and capture Warden forest game
        id: forest
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*json' -print -quit)
          export LIBGL_ALWAYS_SOFTWARE=1 LP_NUM_THREADS=2 LP_NATIVE_VECTOR_WIDTH=128
          python tools/capture_forest.py
      - name: Publish forest game evidence to working branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/evidence/forest-game
          if ! git diff --cached --quiet; then
            git commit -m 'Record real forest game screenshots and gameplay tests [skip ci]'
            git fetch origin arena/449f84de-godot
            git rebase origin/arena/449f84de-godot
            git push origin HEAD:arena/449f84de-godot
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forest-render-evidence
          path: docs/evidence/forest-game
      - name: Reject failed game checks
        if: steps.forest.outcome != 'success'
        run: exit 1

  publish-forest:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_forest && github.ref_name == 'arena/449f84de-godot'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/449f84de-godot
      - name: Require passing evidence for identical project content
        run: |
          python - <<'PYTHON'
          import json, subprocess
          from pathlib import Path
          evidence = json.loads(Path('docs/evidence/forest-game/result.json').read_text())
          assert evidence['passed'] is True
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', evidence['source_commit']], check=True)
          subprocess.run(['git', 'diff', '--exit-code', evidence['source_commit'], 'HEAD', '--', 'forest_game'], check=True)
          PYTHON
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate laboratory build
        run: npm ci --omit=dev --prefix model_lab && npm run build --prefix model_lab
      - name: Package source ZIP and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/package_forest.py
          gh release create warden-forest-v0.3.0-preview.1 .tools/releases/Warden-Forest-Godot-Project.zip .tools/releases/Warden-Forest-Godot-Project.zip.sha256 --target "$GITHUB_SHA" --prerelease --title 'WARDEN — Pose Lab + animation revision | v0.3.0 preview 1' --notes-file docs/FOREST_PREVIEW_RELEASE.md

  inspect-2d:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_2d && github.ref_name == 'arena/449f84de-godot'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/449f84de-godot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only 2D archive catalog
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive13
          pip install gdown py7zr libarchive-c pillow
          python tools/inspect_2d_intake.py
      - name: Record metadata only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets-2d
          if ! git diff --cached --quiet; then
            git commit -m 'Catalog separate user-supplied 2D archive [skip ci]'
            git fetch origin arena/449f84de-godot
            git rebase origin/arena/449f84de-godot
            git push origin HEAD:arena/449f84de-godot
          fi
